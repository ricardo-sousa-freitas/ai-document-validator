# Golden test fixtures for supplier invoices

invoice_001:
  fields:
    supplier_name: "Acme Corporation"
    invoice_number: "INV-2024-001"
    invoice_date: "2026-09-01"
    total_amount: 5000.00
    currency: "EUR"
    tax_id: "VAT-DE-123456789"
  confidence:
    supplier_name: 0.95
    invoice_number: 0.95
    invoice_date: 0.95
    total_amount: 0.95
    currency: 0.90
    tax_id: 0.85
  expected_verdict: "PASS"
  evidence_snippet: "Invoice from Acme Corporation dated 2026-09-01 for 5000.00 EUR"

